<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            background-image: url("https://r2.erweima.ai/imgcompressed/compressed_48f439c24f2c9436ff4bc185cefd30ff.webp");
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat;
            height: 100vh; 
            width: 100vw; 
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
        }
        .box{
            height: 480px;
            width: 350px;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 1s ease-in-out;
            margin-top: 80px;
            margin-left: 250px;
        }
        .box h2 {
            margin-bottom: 30px;
            color: #333;
            font-size: 35px;
        }
        .input-box {
        width: 90%;
        margin-bottom: 15px;
        height: 8%;
        padding: 10px;
        font-size: 16px;
        border: none;
        border-radius: 5px;
        background: #f3f3f3;
        box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.1);
        transition: 0.3s ease-in-out;
        color: #333; /* Ensure text is visible */
    }

    /* Specific fix for select dropdown */
    .input-box select {
        appearance: none; /* Removes default styling */
        -webkit-appearance: none; /* For Safari */
        -moz-appearance: none; /* For Firefox */
        background: #f3f3f3;
        color: #333; /* Ensure dropdown text is visible */
        padding: 10px;
        font-size: 16px;
        width: 100%;
        border-radius: 5px;
        border: none;
        outline: none;
        
    }
    select.input-box {
        height: 40px; /* Adjust height */
        font-size: 16px; /* Adjust font size */
        padding: 10px;
        width: 100%; /* Keep full width */
    }

    /* When focused */
    .input-box select:focus {
        background: white;
        box-shadow: inset 3px 3px 8px rgba(0, 0, 0, 0.2);
    }

        .login-btn {
            width: 95%;
            padding: 12px;
            font-size: 18px;
            color: white;
            background: #007BFF;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s ease-in-out;
        }
        .login-btn:hover {
            background: #0056b3;
            transform: scale(1.05);
        }

        .links {
            margin-top: 15px;
            font-size: 14px;
            cursor: pointer;
        }

        .links a {
            text-decoration: none;
            color: #007BFF;
            transition: 0.3s ease-in-out;
        }

        .links a:hover {
            text-decoration: underline;
            color: #0056b3;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .logout-btn {
            background-color: #dc3545; /* Red color */
            color: white; 
            border: none;
            padding: 8px 16px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease-in-out;
        }

        .logout-btn:hover {
            background-color: #c82333; /* Darker red */
        }

        .logout-btn:focus {
            outline: none;
        }
        /* Hides the box initially */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Login Form -->
    <div class="box" id="loginBox">
        <h2>Login</h2>
        
        <form action="../php_files/login.php" method="POST" >
            <!-- Dropdown to Select User Type -->
            <select name="user_type" class="input-box" required>
                <option value="hotel">Hotel</option>
                <option value="ngo">NGO</option>
            </select>
            
            <input type="email" name="email" class="input-box" placeholder="Email" required>
            <input type="password" name="password" class="input-box" placeholder="Password" required>
            <button type="submit" class="login-btn">Login</button>
            
            <div class="links"> 
                <a href="#">Forgot Password?</a> | 
                <a onclick="showSignup()">New user? Sign Up</a>
            </div>
        </form>
    </div>

    <!-- Signup Form (Initially Hidden) -->
    <div class="box hidden" id="signupBox">
        <h2>Sign Up</h2>

        <form action="http://localhost/AnnSeva/php_files/signup.php" method="POST">

            <input type="password" name="password" class="input-box" placeholder="Create Password" required>
            
            <button type="submit" class="login-btn">Sign Up</button>

            <div class="links">
                <a onclick="showLogin()">Already have an account? Login</a>
            </div>
        </form>
    </div>

    <script>
        function showSignup() {
            document.getElementById("loginBox").classList.add("hidden");
            document.getElementById("signupBox").classList.remove("hidden");
        }

    </script>

</body>
</html>
